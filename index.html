<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>大邱 2泊3日の栞</title>
<meta name="description" content="2026年10月17日から19日まで、大邱を巡る2泊3日の旅行の栞">
<meta name="theme-color" content="#F1F6FA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="shiori-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style id="shiori-css">:root{
  --bg:#F1F6FA;
  --card:#FFFFFF;
  --card-2:#F7FAFD;
  --ink:#2B3340;
  --ink-2:#525D6C;
  --ink-3:#7F8A98;
  --line:#DCE5EE;
  --line-2:#C2CFDD;
  --apple:#E5534F;--apple-soft:#FDE5E3;--apple-ink:#BE3834;--apple-on:#FFFFFF;
  --ginkgo:#F1A62B;--ginkgo-soft:#FFF0CC;--ginkgo-ink:#8F5C00;--ginkgo-on:#3A2800;
  --leaf:#2F9D74;--leaf-soft:#DBF2E8;--leaf-ink:#1F7153;--leaf-on:#FFFFFF;
  --sky:#3F86D2;--sky-soft:#E2EEFB;--sky-ink:#2A67AA;--sky-on:#FFFFFF;
  --marker:#FFEF9E;--marker-ink:#352C00;
  --shadow:0 1px 0 rgba(43,51,64,.05),0 10px 28px rgba(43,51,64,.07);
  --pop:"Mochiy Pop One","Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --maru:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic","Meiryo",sans-serif;
  --kr:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141A21;--card:#1D252F;--card-2:#19212A;--ink:#EDF1F5;--ink-2:#BAC4CF;--ink-3:#8C97A4;--line:#2D3743;--line-2:#3D4957;
    --apple:#FF8A86;--apple-soft:#3A2427;--apple-ink:#FFA9A5;--apple-on:#2A1011;
    --ginkgo:#FFC45C;--ginkgo-soft:#3A2F17;--ginkgo-ink:#FFD386;--ginkgo-on:#2A1D00;
    --leaf:#62D1A4;--leaf-soft:#173429;--leaf-ink:#8CE3BF;--leaf-on:#0B2419;
    --sky:#7DB5F0;--sky-soft:#1B2C40;--sky-ink:#A6CCF5;--sky-on:#0C1B2C;
    --marker:#4A4120;--marker-ink:#FFF3C2;
    --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 28px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141A21;--card:#1D252F;--card-2:#19212A;--ink:#EDF1F5;--ink-2:#BAC4CF;--ink-3:#8C97A4;--line:#2D3743;--line-2:#3D4957;
  --apple:#FF8A86;--apple-soft:#3A2427;--apple-ink:#FFA9A5;--apple-on:#2A1011;
  --ginkgo:#FFC45C;--ginkgo-soft:#3A2F17;--ginkgo-ink:#FFD386;--ginkgo-on:#2A1D00;
  --leaf:#62D1A4;--leaf-soft:#173429;--leaf-ink:#8CE3BF;--leaf-on:#0B2419;
  --sky:#7DB5F0;--sky-soft:#1B2C40;--sky-ink:#A6CCF5;--sky-on:#0C1B2C;
  --marker:#4A4120;--marker-ink:#FFF3C2;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 28px rgba(0,0,0,.25);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--maru);font-weight:500;font-size:1.125rem;line-height:1.9;letter-spacing:.02em}
.page{background:var(--bg);color:var(--ink);overflow-wrap:anywhere;line-break:strict;padding-bottom:3rem}
.wrap{max-width:48rem;margin:0 auto;padding:0 1.1rem}
a{color:var(--sky-ink);text-underline-offset:.2em}
a:focus-visible,button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--sky);outline-offset:3px;border-radius:12px}
h1,h2,h3{text-wrap:balance}
p{text-wrap:pretty}
.d1{--day:var(--apple);--day-soft:var(--apple-soft);--day-ink:var(--apple-ink);--day-on:var(--apple-on)}
.d2{--day:var(--ginkgo);--day-soft:var(--ginkgo-soft);--day-ink:var(--ginkgo-ink);--day-on:var(--ginkgo-on)}
.d3{--day:var(--leaf);--day-soft:var(--leaf-soft);--day-ink:var(--leaf-ink);--day-on:var(--leaf-on)}

.pill{display:inline-block;border-radius:999px;padding:.05rem .8rem;font-size:.9375rem;font-weight:700;letter-spacing:.05em;line-height:1.8;white-space:nowrap}
.ko{display:inline-block;font-family:var(--kr);font-weight:400;font-size:1.3rem;line-height:1.45;letter-spacing:.01em;padding:.15rem .75rem;border-radius:12px;background:var(--marker);color:var(--marker-ink);-webkit-user-select:all;user-select:all;word-break:keep-all;cursor:text}

/* ---------- 表紙 ---------- */
.cover{padding-top:1.75rem}
.cover__card{position:relative;overflow:hidden;background:var(--card);border-radius:30px;box-shadow:var(--shadow);padding:2.1rem 1.5rem 1.6rem}
.cover__card::before{content:"";position:absolute;top:.9rem;left:-1.6rem;width:8rem;height:1.7rem;transform:rotate(-14deg);background:repeating-linear-gradient(135deg,var(--apple-soft) 0 9px,var(--ginkgo-soft) 9px 18px);opacity:.95}
.cover__card::after{content:"";position:absolute;bottom:1rem;right:-1.8rem;width:8rem;height:1.7rem;transform:rotate(-14deg);background:repeating-linear-gradient(135deg,var(--leaf-soft) 0 9px,var(--sky-soft) 9px 18px);opacity:.95}
.cover__place{margin:.4rem 0 0;font-size:1rem;color:var(--ink-3);font-weight:700}
.cover__place span{font-family:var(--kr);font-weight:400;margin-left:.4rem}
.cover__title{margin:.1rem 0 0;font-family:var(--pop);font-weight:400;font-size:clamp(2.3rem,8.4vw,3.5rem);line-height:1.3;letter-spacing:.03em}
.cover__date{margin:.4rem 0 0;font-size:1.2rem;font-weight:700;color:var(--ink-2)}
.tickets{list-style:none;margin:1.5rem 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}
.ticket a{display:flex;flex-direction:column;gap:.1rem;height:100%;padding:.9rem .9rem 1rem;border-radius:22px;background:var(--day-soft);color:var(--ink);text-decoration:none;transition:transform .15s ease}
.ticket a:hover{transform:translateY(-2px)}
@media (prefers-reduced-motion: reduce){.ticket a{transition:none}.ticket a:hover{transform:none}}
.ticket__n{font-family:var(--pop);font-size:.9375rem;color:var(--day-ink)}
.ticket__date{font-family:var(--pop);font-size:2rem;line-height:1.15;color:var(--day-ink);font-variant-numeric:tabular-nums}
.ticket__date small{font-size:.5em;margin-left:.2rem}
.ticket__label{font-size:1rem;line-height:1.65;color:var(--ink-2);font-weight:700}
.cover__stay{position:relative;z-index:1;margin:1.3rem 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .7rem;font-size:1.0625rem;font-weight:700}
.cover__stay .pill{background:var(--leaf-soft);color:var(--leaf-ink)}

.lede{margin:1.6rem .3rem 0;font-size:1.125rem;line-height:2;color:var(--ink-2)}
.toc{margin-top:1.4rem}
.toc ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.55rem}
.toc a{display:inline-block;padding:.3rem 1rem;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 2px var(--line-2);color:var(--ink);text-decoration:none;font-size:1rem;font-weight:700}
.toc a:hover{background:var(--sky-soft)}
.howto{margin:1.2rem 0 0;padding:1rem 1.2rem;border-radius:20px;background:var(--card-2);box-shadow:inset 0 0 0 2px var(--line);font-size:1.0625rem;line-height:1.9;color:var(--ink-2)}
.howto p{margin:0}
.howto b{color:var(--ink)}

/* ---------- 節 ---------- */
.sec{margin-top:3.2rem}
.sec__title{margin:0 0 1rem;font-family:var(--pop);font-weight:400;font-size:1.65rem;line-height:1.4}
.sec__title span{background:linear-gradient(transparent 60%,var(--marker) 60%);padding:0 .2rem}
.sec__note{margin:-.4rem 0 .9rem;font-size:1rem;color:var(--ink-3)}
.box{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:.4rem 1.3rem}
.kv{margin:0}
.kv__row{display:grid;grid-template-columns:8.5rem minmax(0,1fr);gap:.2rem 1rem;padding:.9rem 0;border-bottom:2px dotted var(--line)}
.kv__row:last-child{border-bottom:0}
.kv dt{font-size:1rem;font-weight:700;color:var(--ink-2);padding-top:.1rem}
.kv dd{margin:0;font-size:1.0625rem;line-height:1.9}
.sub{margin:1.6rem 0 .6rem;font-size:1.2rem;font-weight:700}

/* ---------- 各日 ---------- */
.day{margin-top:3.6rem}
.day__head{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:.2rem 1rem;background:var(--day-soft);border-radius:28px;padding:1.1rem 1.3rem 1.2rem}
.day__badge{grid-row:span 2;width:4.8rem;height:4.8rem;border-radius:50%;background:var(--day);color:var(--day-on);display:grid;place-content:center;text-align:center;font-family:var(--pop);line-height:1.05}
.day__badge b{font-weight:400;font-size:2rem}
.day__badge span{font-size:.8125rem}
.day__date{margin:0;font-size:1.0625rem;font-weight:700;color:var(--day-ink)}
.day__title{margin:0;font-family:var(--pop);font-weight:400;font-size:1.45rem;line-height:1.5}
.day__summary{grid-column:1/-1;margin:.6rem 0 0;font-size:1.0625rem;line-height:1.9;color:var(--ink-2)}
.day__steps{grid-column:1/-1;justify-self:start;margin-top:.4rem;background:var(--card);color:var(--day-ink)}

.tl{list-style:none;margin:1.4rem 0 0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:2.3rem;top:1rem;bottom:1rem;border-left:3px dashed var(--day);opacity:.6}
.slot{position:relative;display:grid;grid-template-columns:4.6rem minmax(0,1fr);column-gap:.9rem;margin-bottom:1.1rem}
.slot:last-child{margin-bottom:0}
.slot__time{position:relative;z-index:1;align-self:start;margin-top:.8rem;padding:.25rem 0;border-radius:14px;background:var(--bg);text-align:center;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.slot__time b{display:block;font-size:1.3rem;color:var(--day-ink)}
.slot__time span{display:block;margin-top:.15rem;font-size:.9375rem;color:var(--ink-3)}
.card{min-width:0;background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:1rem 1.2rem 1.15rem}
.slot--move .card{background:var(--card-2);box-shadow:inset 0 0 0 2px var(--line-2)}
.card__top{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .6rem}
.kind{background:var(--day-soft);color:var(--day-ink)}
.kind--move,.kind--air{background:var(--sky-soft);color:var(--sky-ink)}
.kind--food{background:var(--ginkgo-soft);color:var(--ginkgo-ink)}
.kind--meal{background:var(--apple);color:var(--apple-on)}
.kind--stay,.kind--rest{background:var(--leaf-soft);color:var(--leaf-ink)}
.card__place{margin:.4rem 0 0;font-size:1.3rem;font-weight:700;line-height:1.55}
.card__ko{margin:.35rem 0 0;display:flex;flex-wrap:wrap;gap:.4rem}
.card__what{margin:.65rem 0 0;font-size:1.125rem;line-height:1.9}
.why{margin:.8rem 0 0;padding:.75rem 1rem;border-radius:18px;background:var(--day-soft);font-size:1.0625rem;line-height:1.9}
.why b{display:block;font-size:.9375rem;color:var(--day-ink)}
.dl{display:grid;grid-template-columns:5.4rem minmax(0,1fr);gap:.55rem .8rem;margin:.95rem 0 0;font-size:1.0625rem;line-height:1.85}
.dl dt{padding-top:.05rem}
.dl dt .pill{font-size:.875rem;background:var(--card-2);color:var(--ink-2);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.dl dt.is-caution .pill{background:var(--apple-soft);color:var(--apple-ink);box-shadow:none}
.dl dd{margin:0;min-width:0}

/* ---------- 食・韓国語・リスト ---------- */
.dishes,.phrases,.checks,.bullets{list-style:none;margin:0;padding:0}
.dish{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.2rem .8rem;padding:1rem 0;border-bottom:2px dotted var(--line)}
.dish:last-child,.phrase:last-child,.check:last-child,.bullets li:last-child{border-bottom:0}
.dish__name{font-size:1.2rem;font-weight:700;line-height:1.6}
.dish__name .ko{font-size:1.1rem;margin-left:.3rem;vertical-align:.08em}
.heat{align-self:start;margin-top:.2rem;background:var(--card-2);color:var(--ink-2);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.heat--0{background:var(--leaf-soft);color:var(--leaf-ink);box-shadow:none}
.heat--1{background:var(--ginkgo-soft);color:var(--ginkgo-ink);box-shadow:none}
.heat--2{background:var(--apple-soft);color:var(--apple-ink);box-shadow:none}
.heat--3{background:var(--apple);color:var(--apple-on);box-shadow:none}
.dish__where,.dish__note{grid-column:1/-1;margin:.35rem 0 0;font-size:1.0625rem;line-height:1.85}
.dish__where b{font-size:.9375rem;color:var(--ink-3);margin-right:.5rem}
.dish__note{color:var(--ink-2)}
.phrase{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:.1rem 1rem;align-items:center;padding:.85rem 0;border-bottom:2px dotted var(--line)}
.phrase__ja{font-size:1.0625rem;font-weight:700}
.phrase__ko{justify-self:start}
.phrase__read{grid-column:2;font-size:1rem;color:var(--ink-3)}
.bullets li{padding:.8rem 0;border-bottom:2px dotted var(--line);font-size:1.0625rem;line-height:1.9}
.tag{margin:0 .6rem .15rem 0;background:var(--sky-soft);color:var(--sky-ink);vertical-align:.08em}
.tag--hot{background:var(--apple);color:var(--apple-on)}
.memo-group + .memo-group{margin-top:1rem}
.memo-group h3{margin:1rem 0 .2rem;font-size:1.15rem;font-weight:700}

.check{border-bottom:2px dotted var(--line)}
.check label{display:grid;grid-template-columns:1.8rem minmax(0,1fr);gap:.8rem;padding:.85rem 0;cursor:pointer;font-size:1.0625rem;line-height:1.85}
.check input{appearance:none;-webkit-appearance:none;width:1.6rem;height:1.6rem;margin:.1rem 0 0;border-radius:9px;background:var(--card);box-shadow:inset 0 0 0 2.5px var(--line-2);display:grid;place-content:center;cursor:pointer}
.check input::after{content:"";width:.7rem;height:.38rem;border-left:3px solid var(--leaf-on);border-bottom:3px solid var(--leaf-on);transform:translateY(-2px) rotate(-45deg);opacity:0}
.check input:checked{background:var(--leaf);box-shadow:none}
.check input:checked::after{opacity:1}
.check input:checked + span{color:var(--ink-3)}
.check b{font-weight:700}
.check small{display:block;font-size:1rem;color:var(--ink-3)}
.amount{font-variant-numeric:tabular-nums}

/* ---------- 更新パネル ---------- */
.updater .box{padding:1.2rem 1.3rem 1.4rem}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1rem}
.step{display:grid;gap:.5rem}
.step__label{font-weight:700;font-size:1.0625rem}
.step__label .pill{margin-right:.5rem;background:var(--sky-soft);color:var(--sky-ink)}
.step p{margin:0;font-size:1rem;color:var(--ink-2)}
.btns{display:flex;flex-wrap:wrap;gap:.6rem}
.btn{font:inherit;font-weight:700;font-size:1.0625rem;line-height:1.5;border:0;border-radius:999px;padding:.6rem 1.3rem;background:var(--sky);color:var(--sky-on);cursor:pointer}
.btn--ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line-2)}
.btn--go{background:var(--leaf);color:var(--leaf-on)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.file{font:inherit;font-size:1rem}
.status{margin:0;padding:.7rem 1rem;border-radius:16px;background:var(--card-2);box-shadow:inset 0 0 0 2px var(--line);font-size:1rem;line-height:1.8}
.status[data-tone="ok"]{background:var(--leaf-soft);box-shadow:none}
.status[data-tone="warn"]{background:var(--ginkgo-soft);box-shadow:none}
.status[data-tone="err"]{background:var(--apple-soft);box-shadow:none}
.previewbar{position:sticky;top:0;z-index:10;background:var(--ginkgo);color:var(--ginkgo-on);font-weight:700;text-align:center;padding:.5rem 1rem;font-size:1rem}

.foot{margin-top:3rem;text-align:center;font-size:1rem;color:var(--ink-3)}
.maplink{display:inline-block;margin:.35rem 0 0 .1rem;padding:.12rem .7rem;border-radius:12px;background:var(--sky-soft);color:var(--sky-ink);font-size:.9375rem;font-weight:700;text-decoration:none;white-space:nowrap}
.maplink:hover{text-decoration:underline}
.maplink--site{background:var(--leaf-soft);color:var(--leaf-ink);margin-left:.4rem}
.taxi__map{margin:.6rem 0 0}
.taxi__map .maplink{background:var(--card);color:var(--ink);font-size:1rem}
.kogroup{display:inline-flex;flex-direction:column;align-items:flex-start;gap:.1rem;vertical-align:top}
.yomi{font-size:.9375rem;font-weight:700;line-height:1.45;color:var(--ink-3);letter-spacing:.03em;padding-left:.15rem}
.card__ko{align-items:flex-start}
.dish__head .kogroup{margin-left:.1rem}
.taxi__yomi{margin:.1rem 0 0;font-size:1.0625rem;font-weight:700;line-height:1.5;color:var(--marker-ink);opacity:.85}
.vcases{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.9rem}
.vcase{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:.9rem 1.1rem 1rem;border-left:10px solid var(--leaf)}
.vcase--warn{border-left-color:var(--ginkgo)}
.vcase--hot{border-left-color:var(--apple)}
.vcase__case{margin:0 0 .3rem;font-size:1.2rem;font-weight:700;line-height:1.5}
.vcase--ok .vcase__case{color:var(--leaf-ink)}
.vcase--warn .vcase__case{color:var(--ginkgo-ink)}
.vcase--hot .vcase__case{color:var(--apple-ink)}
.vcase .dl{margin-top:.5rem;gap:.4rem .7rem}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
label.btn{display:inline-block}
.btns label.btn:focus-within{outline:3px solid var(--sky);outline-offset:3px}
.lede + .lede{margin-top:.9rem}
.taxi{margin:0 0 1rem;padding:1rem 1.2rem 1.1rem;border-radius:24px;background:var(--marker);color:var(--marker-ink)}
.taxi__label{margin:0;font-size:1rem;font-weight:700}
.taxi__ko{margin:.15rem 0 0;font-family:var(--kr);font-size:clamp(1.6rem,6.4vw,2.2rem);line-height:1.35;-webkit-user-select:all;user-select:all;word-break:keep-all}
.taxi__addr{margin:.25rem 0 0;font-family:var(--kr);font-size:1.3rem;line-height:1.5;-webkit-user-select:all;user-select:all;word-break:keep-all}

@media (max-width: 36rem){
  .wrap{padding:0 .85rem}
  .cover__card{padding:2rem 1.15rem 1.4rem}
  .tickets{grid-template-columns:1fr;gap:.6rem}
  .ticket a{flex-direction:row;align-items:center;gap:.9rem;padding:.7rem 1rem}
  .ticket__date{font-size:1.7rem;min-width:4.6rem}
  .kv__row{grid-template-columns:1fr;gap:.1rem}
  .tl::before{left:1.9rem}
  .slot{grid-template-columns:3.8rem minmax(0,1fr);column-gap:.55rem}
  .slot__time b{font-size:1.15rem}
  .slot__time span{font-size:.875rem}
  .card{padding:.9rem 1rem 1rem}
  .dl{grid-template-columns:1fr;gap:.1rem}
  .dl dt{margin-top:.55rem}
  .phrase{grid-template-columns:1fr}
  .phrase__read{grid-column:1}
  .day__badge{width:4.2rem;height:4.2rem}
  .day__badge b{font-size:1.75rem}
}

/* ---------- 小さい画面の読みやすさ ---------- */
.page{overflow-wrap:break-word}
h1,h2,h3,.card__place,.day__title,.ticket__label,.vcase__case,.sec__title,.dish__name,.phrase__ja,.memo-group h3,.cover__stay{word-break:auto-phrase}
.yomi,.taxi__yomi,.phrase__read,.rd{word-break:keep-all;overflow-wrap:break-word}
.rd{font-size:.9em;color:var(--ink-2)}
a.tel{white-space:nowrap}
@media (max-width: 36rem){
  .tl::before{display:none}
  .slot{grid-template-columns:minmax(0,1fr);row-gap:.35rem;margin-bottom:1rem}
  .slot__time{display:flex;align-items:baseline;gap:.2rem;margin:0 0 0 .35rem;padding:0;background:none;text-align:left}
  .slot__time b{font-size:1.15rem}
  .slot__time span{display:inline;margin:0;font-size:1rem;color:var(--ink-3)}
  .slot__time span::before{content:"〜";margin-right:.2rem}
  .card{padding:.9rem 1rem 1rem}
  .card__place{font-size:1.2rem}
  .ko{font-size:1.15rem}

などのだしの素朴な麺。卓上の唐辛子の薬味は入れずに食べられる", "dish_ko_yomi": "カルグクス"}, {"dish": "双和茶（薬膳茶）", "dish_ko": "쌍화차", "spicy": "辛くない", "where": "味道茶房（中区チンゴルモクキル14）", "note": "生薬を煮出した温かい茶で、松の実やナツメが浮く。昔ながらの菓子が一緒に出る", "dish_ko_yomi": "サンファチャ"}, {"dish": "韓方参鶏湯", "dish_ko": "한방삼계탕", "spicy": "辛くない", "where": "薬田韓方参鶏湯（ヤクチョン ハンバン サムゲタン）（薬令市の韓医薬博物館のそば）", "note": "生薬を加えて煮た丸鶏のスープ。量が多いので、夜に会食がある日の昼には重い", "dish_ko_yomi": "ハンバン サムゲタン"}, {"dish": "タロクッパ（牛肉スープとご飯が別々）", "dish_ko": "따로국밥", "spicy": "中辛（辣油で赤いが見た目ほど辛くない）", "where": "国一タロクッパ（クギル タロクッパプ）（중구 국채보상로 571（チュング クッチェ ボサンノ オベクチルシビル）、ホテルから徒歩約10分、24時間営業）", "note": "1946年創業の大邱生まれの一杯。スープとご飯が別々に出るのが名前の由来で、同じものは日本にない。牛の血を固めたソンジが入るので、苦手なら「선지 빼주세요（ソンジ ペジュセヨ）」と伝える。24時間営業なので、朝を外で取りたいときや夜遅くにも入れる", "dish_ko_yomi": "タロクッパプ"}], "rain": [{"when": "10月17日(土)の夜", "text": "西門夜市が雨で休場なら、夕食を半月堂のザ・現代 大邱のレストラン街（半月堂駅18番出口そば、10:30〜22:00）に切り替え、ホテルから徒歩で往復する。観覧車は屋根付きのゴンドラなので乗れるが、眺めは落ちる"}, {"when": "10月18日(日)の午前", "text": "石段が濡れて滑るので、青蘿丘と3・1万歳運動路は省き、タクシーで桂山聖堂前へ行って薬令市に進む。午後は屋内の香村文化館・大邱文学館（中央路駅すぐ、日曜開館、1,000ウォン）を歴史館と合わせて見る"}, {"when": "10月19日(月)の午前", "text": "西門市場を短く切り上げ、ホテルの最寄りの半月堂駅地下商店街（10:00〜22:00）やオリーブヤング大邱タウン店で、濡れずに土産を探す"}], "memo": [{"category": "1日目の差し替え（TW214が12:05発のとき）", "text": "手続き締切は11:15になるので、伊万里を7:30ごろ出て9:20までに国際線駐車場へ入る。朝食を多めに取り、昼は大邱で。ホテルに14:30ごろ着いて荷物を預け、泰山餃子で遅い昼食（中休みの有無は要確認）、15:30〜17:00は薬令市韓医薬博物館（土曜開館）。17:05から先は通常どおり。日曜は古宅から泰山餃子へ直行し、博物館を省く。"}, {"category": "交通カード", "text": "バスの運賃は交通カード1枚で人数分をまとめて払える。手元にカードがない状態でバス・地下鉄に乗るときだけT-moneyなどが要る。コンビニで3,000ウォン前後で買い、レジで現金チャージ（「교통카드 충전해 주세요（キョトンカドゥ チュンジョネ ジュセヨ）. 만 원이요（マヌォニヨ）」）"}, {"category": "バスのまとめ払い", "text": "市内バスは前扉で運転手に人数を伝えてから、カードを1回だけタッチする。先にタッチを重ねると弾かれ、降りるときに前扉の端末へタッチすると二重に引かれる。乗換割引はカード1枚につき1人分なので、乗り継ぐと残りは満額と見込む。市内バスは現金不可"}, {"category": "地下鉄", "text": "地下鉄はカード1枚で複数人は通れない。カードのない分は駅の発売機で1回券（円形のトークン、1,700ウォン、現金）を買い、出るときは改札の投入口に入れる。22:30を過ぎたら地下鉄とバスは使わずタクシーにする"}, {"category": "タクシー", "text": "ホテルの前は路地なので、乗り降りは中央大路（チュンアンデロ）のバス停「약령시건너(동성로입구)（ヤンニョンシ ゴンノ）」前（ホテルから約120m・徒歩2分）でする。行き先は口で言わず、ハングルの名称と住所を画面で見せる。後部座席もシートベルトを締める。深夜は0〜2時が30%、2〜4時が20%の割増"}, {"category": "お金", "text": "カード払いが広く通るが、屋台と市場の一部は現金のみ。現金は1日1〜2万ウォンほどで足りる（目安）。円建てかウォン建てかを聞かれたらウォン建てを選ぶ。市内の両替はホテルの向かいのMONEY BOX大邱支店（9:00〜20:00、土日の営業は要確認）。ホテル館内のWOWPASS機で円からチャージしたカードは交通カードにもなる"}, {"category": "休み（18日・日曜）", "text": "西門市場の昼の営業は第1・第3日曜が休みで、10月18日は休み。夜市は19:00〜22:30で開く"}, {"category": "休み（19日・月曜）", "text": "大邱近代歴史館、薬令市韓医薬博物館、香村文化館（ヒャンチョン ムヌァグァン）、キム・グァンソク・ストーリーハウス、国一館、泰山餃子、美盛堂、西門夜市が休み"}, {"category": "通信とアプリ", "text": "出発前に韓国で使えるeSIMかローミングを用意する。データ通信専用のeSIMには電話番号が割り当てられず、119を含めて音声の発信ができないので、通話は日本の回線を生かしたまま、データだけをeSIM側に寄せる。地図はNAVER Map（Googleマップは韓国内の徒歩・車の案内が出ない）。iOS https://apps.apple.com/jp/app/id311867728 、Android https://play.google.com/store/apps/details?id=com.nhn.android.nmap&hl=ja 。翻訳はPapago。iOS https://apps.apple.com/jp/app/id1147874819 、Android https://play.google.com/store/apps/details?id=com.naver.labs.translator&hl=ja 。カメラで看板やメニューを読め、文字の翻訳と定型の会話集は電波のない場所でも使える。入れずに済ませるならブラウザ版 https://papago.naver.com/ 。どちらも提供元はNAVER Corp."}, {"category": "トイレ", "text": "ホテル、博物館、歴史館、空港で済ませておく。西門市場は地区ごとの建物内の共用トイレを使う（場所は場内の案内図で確認）。古いトイレでは紙がないことがある"}, {"category": "薬", "text": "半月堂駅（パヌォルダンニョク）の地下商店街に薬局が集まっている。日曜や夜に開く薬局は、大邱広域市の日本語ページ https://www.daegu.go.kr/japanese/index.do?menu_id=00933793 に薬局名・住所・営業時間・電話が日本語で並ぶ（中区はテハ薬局、中区中央大路447-1、9:00〜20:00、年中無休、+82-53-254-8164）。ここに載らない時間帯や地区は「휴일지킴이약국（ヒュイル ジキミ ヤックク）」 https://www.pharm114.or.kr/ で探せるが韓国語だけなので、Papagoのカメラ翻訳と併せて使う。コンビニで買えるのは解熱鎮痛剤・胃腸薬・風邪薬・湿布など安全常備医薬品の13品目に限られる。"}, {"category": "持ち帰り", "text": "肉製品（加工品を含む）は日本へ持ち込めない。免税店で買ったものも例外にならず、原材料の表示に肉が入っていれば対象になる（動物検疫所 https://www.maff.go.jp/aqs/tetuzuki/qanda/souvenir.html ）。柚子茶やコチュジャンなど液体・ペースト類の土産は預け荷物に入れる。日本へ持ち帰るときの免税の範囲は、その他の品物が海外市価の合計20万円まで、酒類3本（1本760ml）、紙巻たばこ200本、香水2オンス（税関 https://www.customs.go.jp/kaigairyoko/menzei.htm ）。"}, {"category": "地下鉄の路線図", "text": "大邱1〜3号線を含む韓国の地下鉄路線図は Smarter Subway が日本語で読める。所要時間・運賃・乗り換え・出口が出るので、半月堂や西門市場への行き方を地下で確かめるのに向く。無料で使える（アプリ内購入あり）。iOS https://apps.apple.com/jp/app/id580488128 、Android https://play.google.com/store/apps/details?id=teamDoppelGanger.SmarterSubway&hl=ja"}, {"category": "タクシーの配車", "text": "流しを拾うほかに、アプリで呼ぶ手もある。訪韓者向けの k.ride は Kakao Mobility が出しているもので、GoogleかAppleのIDかメール、または携帯番号の認証で登録でき、海外発行のクレジットカード・チェックカードとAlipay+・WeChat Payが使える。画面は日本語で、行き先の検索と運転手とのやりとりが133言語で自動翻訳される。問い合わせ窓口は韓国時間9:00〜翌2:00。iOS https://apps.apple.com/jp/app/id6474654222 、Android https://play.google.com/store/apps/details?id=com.kakaomobility.kride&hl=ja 、案内 https://kride.kakaomobility.com/ 。台数の多い Kakao T は登録に韓国のメッセンジャー（KakaoTalk）のアカウントが要るので予備扱いにし、使うなら事前のカード登録ではなく、降車時に現金・カード・T-moneyで運転手に払う方法を選ぶ。iOS https://apps.apple.com/jp/app/id981110422 、Android https://play.google.com/store/apps/details?id=com.kakao.taxi&hl=ja （両ストアとも表題はハングルのままなので、名前で探さずリンクから開く）。大邱で必ず配車が付くとは限らないので、付かないときは中央大路で流しを拾うか、ホテルのフロントから呼んでもらう。"}, {"category": "WOWPASS", "text": "ホテル館内のWOWPASS機を使うにはアプリが要る。円の現金を入れてチャージしたカードは、店の支払いにも交通カードにも使え、残高とチャージ履歴はアプリで見られる。両替所の営業が読めない土日の逃げ道にもなる。iOS https://apps.apple.com/jp/app/id1626691440 、Android https://play.google.com/store/apps/details?id=com.wow.wowpass&hl=ja 、日本語の案内 https://www.wowpass.io/ja"}, {"category": "医療", "text": "薬局で足りないときは、大邱広域市の日本語ページに外国人診療機関の一覧（診療科・住所・電話・対応言語）と総合病院の一覧がある： https://www.daegu.go.kr/japanese/index.do?menu_id=00300783 。対応言語の欄はおおむね英語で、日本語対応の明記はないので、言葉が通じないときは1330の通訳に間に入ってもらう。救急車を呼ぶほどではないが日曜や夜に診てほしいときは、開いている病院・薬局を探せるE-GEN https://www.e-gen.or.kr/ （韓国語のみ）を予備にする。"}, {"category": "電話のかけ方", "text": "日本の端末から韓国の番号にかけるときは、先頭の0を落として +82 を付ける（番号欄の0を長押しすると + が出る）。韓国のeSIMや現地のSIMで韓国内にかけるときは、栞の国内表記のままでよい。119と112は国番号を付けず3桁のままかける。1588・1688で始まる全国代表番号は海外からつながらないのが通例なので、日本の端末からはかけない。1330に日本語で相談するときは +82-2-1330。電話が難しい場面では、公式の日本語ページ https://japanese.visitkorea.or.kr/svc/contents/contentsView.do?vcontsId=140643&menuSn=454 にライブチャット・LINE・KakaoTalkの窓口があり、案内の運営時間は韓国時間7:00〜24:00と書かれている。"}, {"category": "地図リンク", "text": "各行程に付けた地図リンクは、押すと地図アプリ（入っていなければブラウザの地図）が開く。検索語をハングルのままにしてあるので、開いた画面をそのままタクシーの運転手に見せられて、韓国語を打つ必要がない。韓国では徒歩と車の経路が出ないため、経路のリンクは公共交通のものだけにしてある。実際に歩く道順はNAVER Mapで検索し直す。"}, {"category": "免税（タックスリファンド）", "text": "1回の買い物が15,000ウォン以上なら還付の対象になる。店頭でその場で引かれる即時還付は1回100万ウォン未満・滞在中の合計500万ウォン以下まで。それを超える分や即時還付をしない店では還付の書類を受け取り、出国の日に税関で品物・書類・パスポートを見せてから、還付カウンターか無人機で受け取る。手順は韓国観光公社の日本語ページ https://japanese.visitkorea.or.kr/svc/contents/contentsView.do?menuSn=489&vcontsId=248765 。大邱空港のどこに還付の窓口があるかは、空港の日本語の施設案内 https://www.airport.co.kr/daegujpn/cms/frCon/index.do?MENU_ID=30 で当日確かめる。"}, {"category": "福岡空港の駐車場", "text": "国際線ターミナルの向かいにある国際線駐車場にとめる。住所は福岡市博多区大字青木742、収容1,126台（うち平面179台）、24時間年中無休で有人対応は7:00〜23:00（駐車場管理事務所 092-611-4200）。普通車の通常期の料金は入場から60分400円、以降30分毎200円、24時間毎の最大2,400円で、入場から30分以内の出場は無料。10月17日〜19日は公式の多客期カレンダーに色が付かない通常期（2026年10月の多客期は10日〜12日のみ）。決済はクレジットカードと電子マネーで、現金とETCは公式に記載がない。国内線駐車場は24時間毎の最大が3,500円と高く、ターミナル間の移動も要るので使わない。 https://www.fukuoka-airport.jp/access/car.html"}, {"category": "駐車場の事前予約", "text": "満車でも待たずに入れる事前予約がある。予約料金は駐車料金とは別に1件1,000円。受付は出場予定日の60日前の午前0時から当日の入庫前までで、インターネットのみ（電話予約はなく、会員登録が要る）。対象は全幅2.2m以内・全長5.0m以内・全高2.1m以内・重量2t以内の普通自動車で、立体駐車場3階の予約エリアに入れる。入場予定日時の変更はできず、予定時刻から2時間過ぎると自動キャンセルになり予約料金は全額かかるので、入場の予定は確実に入れる時刻にする。出場予定日を超えると超過日数かける1,000円の加算金が付くため、出場の予定は遅めに置く（出場予定日時だけは入場後でも変えられる）。キャンセル料は入場予定日の8日前まで無料、7日前から2日前が50%、前日と当日が100%。予約管理センター 092-624-0122（平日9:00〜17:00）。 https://www.fukuoka-airport.jp/access/parking_reservation/"}, {"category": "満車のとき", "text": "公式サイトに当日の空き状況を示すページはなく、国際線増改築工事で収容台数が変わるとの掲示が出ている。予約が取れない条件の車は、入庫を早めるほかに手がない。寸法が境目に近いときは駐車場管理事務所 +81-92-611-4200（7:00〜23:00）へ先に電話して確かめる。"}, {"category": "民間駐車場を使う場合", "text": "国際線ターミナルまで送迎すると公式に書いているのはサイドパーキング（福岡市博多区豊2-6-22、092-436-4660、営業5:45〜当日の予約車終了まで、電話受付10:00〜16:00、大型車・特殊車は1日2,500円、出発3日前までのネット予約で2,200円）だけ。ビッグパーキング・クロスパーク・エイティパーキング・タカパーキングは国内線までの送迎で、国際線へは無料連絡バスに乗り換えることになる。クロスパークとエイティパーキングは全長5m以上・1ナンバー・8ナンバーを断ると明記している。えびすパーキングは10月14日から19日が臨時休業で使えない。帰りは19時台に迎えを呼ぶことになるが、サイドパーキングの電話受付は16時までと書かれているため、使うなら予約のときに到着便名と時刻を伝えて迎えの確約を取る（要確認）。"}, {"category": "車に置くもの・持って出るもの", "text": "駐車場管理規程は、車内に残した積載物の損害について一切責任を負わないと定めている。現金・カード類・パスポート・ETCカードなど値打ちのある物は車に残さず持って出る。駐車券は出場まで携帯する決まりで、失くすと出場願を書いて運転免許証などを示す手続きになるため、パスポートと同じケースに入れておく。帰りに使う上着や傘は車に置いておいてよい。とめた階と区画番号は写真に撮る（1,126台あり帰りに迷いやすい）。場内は喫煙と宿泊が禁じられ、連続14日以上はとめられない。"}, {"category": "高速料金と給油", "text": "有料なのは福岡前原道路（普通車 前原東から周船寺220円、今宿から福岡都市高速150円、全線370円）と福岡都市高速（普通車 現金630円、ETCは平日630円・土曜590円・日祝560円・22時から翌7時は560円）の2か所だけで、佐賀県側の西九州自動車道は無料。福岡前原道路はETC割引がなく、クレジットカードも使えない（現金かETC）。往復の高速料金は約1,960円（ETC）。経路上の高速道路に給油所は見あたらないので、伊万里を出る前に満タンにしておく。空港に近い給油所の apollostation 福岡空港SS（博多区空港前3-3-40、092-622-6538）は8:00〜20:00で、19日は閉店間際になる。"}, {"category": "西九州道の夜間通行止め", "text": "二丈鹿家ICから伊万里東府招ICの間では、工事のため21時から翌朝6時の全面通行止めが設定されることがある（土曜・日曜・祝日を除く）。伊万里市の公表分は10月10日朝までで10月19日は対象外だが、復路は平日の夜なので、延長や追加がないかを出発前に伊万里市都市政策課 0955-23-2476 で確かめる。該当すると国道202号・204号へ迂回することになり、所要が大きく延びる。 https://www.city.imari.lg.jp/21016.htm"}, {"category": "送迎で車を着ける場合", "text": "ターミナルビル前の1階の道路は一般車の駐停車ができない。降ろすだけなら3階の降車場、乗り降りするなら国際線乗降場（13台、24時間、10分まで無料、10分超から20分まで500円、以降10分ごと250円、車両制限は高さ2.4m・長さ5.0m・幅2.2m）を使う。乗降場の精算は出口で現金のみで、クレジットカードも立体駐車場の事前精算機も使えない。"}], "phrases": [{"ja": "すみません（店員を呼ぶとき）", "ko": "여기요", "reading": "ヨギヨ"}, {"ja": "これください", "ko": "이거 주세요", "reading": "イゴ ジュセヨ"}, {"ja": "いくらですか", "ko": "얼마예요?", "reading": "オルマエヨ"}, {"ja": "辛くないものはありますか", "ko": "안 매운 거 있어요?", "reading": "アン メウン ゴ イッソヨ"}, {"ja": "辛くしないでください", "ko": "안 맵게 해 주세요", "reading": "アン メプケ ヘ ジュセヨ"}, {"ja": "個室でお願いします", "ko": "룸으로 부탁드려요", "reading": "ルムロ プタットゥリョヨ"}, {"ja": "カードで払えますか", "ko": "카드 돼요?", "reading": "カドゥ デヨ"}, {"ja": "領収書をください", "ko": "영수증 주세요", "reading": "ヨンスジュン ジュセヨ"}, {"ja": "ここへ行ってください", "ko": "여기로 가 주세요", "reading": "ヨギロ カ ジュセヨ"}, {"ja": "荷物を預かってもらえますか", "ko": "짐 좀 맡아 주실 수 있어요?", "reading": "チム チョム マタ ジュシル ス イッソヨ"}, {"ja": "トイレはどこですか", "ko": "화장실 어디예요?", "reading": "ファジャンシル オディエヨ"}, {"ja": "日本語を話せる方はいますか", "ko": "일본어 하시는 분 있어요?", "reading": "イルボノ ハシヌン ブン イッソヨ"}, {"ja": "免税（タックスリファンド）をお願いします", "ko": "택스 리펀드 해 주세요", "reading": "テクス リポンドゥ ヘ ジュセヨ"}, {"ja": "ありがとうございます", "ko": "감사합니다", "reading": "カムサハムニダ"}], "packing": [{"item": "パスポート", "note": "化粧品店などでの免税（その場で税抜き）にも使うので、買い物の日も持ち歩く"}, {"item": "常備薬", "note": "ふだん飲んでいる薬を日数分と少しの予備"}, {"item": "ふだん使う身の回りのもの", "note": "スマートフォン、眼鏡など"}, {"item": "羽織れる上着", "note": "日没後は日中より10度近く下がる"}, {"item": "交通系ICカードか、タッチ決済のできるクレジットカード", "note": "帰りの福岡空港から博多駅への直行バスで使う"}, {"item": "忘れても現地で買えるもの", "note": "充電器・変換プラグ・日用品は、ダイソー大邱東城路本店（10:00〜22:00）、ホテルの建物1階のコンビニ、半月堂駅の地下商店街で買える（在庫は店による）。韓国のコンセントは丸ピン2本の220Vで、日本のプラグはそのままでは挿さらない"}], "checks": [{"when": "予約時", "text": "予約確認書のホテル番号00297と住所「동성로1길 15（トンソンノ イルキル シボ）」を確認する"}, {"when": "予約後すぐ", "text": "10月19日のチェックアウト後に荷物を預けられるか、ホテルにメールか電話で確認する"}, {"when": "出発3週間前まで", "text": "国一館（+82-53-254-8700（韓国内では 053-254-8700。0507-1387-8703 は転送用の番号で、海外からつながらないことがある））に電話し、日曜18:00の個室（룸（ルム））を予約する。あわせて辛い品を減らせるかと、当日営業していることを確認する"}, {"when": "出発1か月前", "text": "K-ETAの一時免除（公式の告知では2026年12月31日まで）が続いているかを、公式の日本語ページ https://www.k-eta.go.kr/portal/newapply/index.do?locale=JP で確認する。申請が要る場合も、公式サイトか公式アプリ（K-ETA、提供元は法務部）だけを使い、代行や優先受付をうたう有料サイトは使わない。免除を使う場合も入国カード（e-Arrival Card）の提出は要る。"}, {"when": "出発1か月前", "text": "車検証で全高を確かめる。2.5m未満なのは確認済みで、料金は普通車の区分（2泊3日7,200円）。2.1m以下なら立体駐車場に入れて事前予約もできる。2.1mを超えるなら平面駐車場（179台、予約不可）だけになるので、当日は入庫を早める。全幅2.2m・全長5.0m・重量2tの3つも併せて控える"}, {"when": "出発1か月前", "text": "高さ2.1m以下なら、福岡空港 国際線駐車場の事前予約を取る（予約料金1件1,000円）。出場予定日10月19日の60日前は8月20日ですでに受付中。無料で取り消せるのは入場予定日10月17日の8日前、10月9日まで。 https://www.fukuoka-airport.jp/access/parking_reservation/"}, {"when": "出発前の週", "text": "TW214とTW215の時刻を予約確認とトリニティ航空サイトで再確認する。TW214が12:05発なら、1日目は備考の差し替え案で動く"}, {"when": "出発前の週", "text": "トリニティ航空のWebチェックイン（国際線は出発24時間前から1時間前まで、福岡発は対象）の手順を https://www.trinityairways.com/app/serviceInfo/contents/1121 で読んでおく。搭乗券は画像で保存するか、iPhoneならApple Wallet、GalaxyならSamsung Walletに入れる。預け荷物がなければカウンターに寄らず保安検査へ進め、預けるときはカウンターでQRコードを見せる。"}, {"when": "出発前の週", "text": "円とウォんの相場を https://finance.yahoo.co.jp/quote/JPYKRW=X で見て、栞の目安（100円≒870ウォン）との差を確かめる。両替所や店頭の提示額が妥当かを、その場でこの値と見比べられる。"}, {"when": "出発前の週", "text": "外務省のたびレジ https://www.ezairyu.mofa.go.jp/ に短期の渡航を登録しておく。滞在中に注意が出たときに日本語で連絡が届く。"}, {"when": "出発前の週", "text": "駐車場の多客期カレンダーで10月17日〜19日が通常期のままかを見直し、国際線増改築工事による収容台数の変動     return html.replace(LINK_RE, function (m, full, bare, phone) {
      if (phone) {
        var shownPhone = phone.replace(/[\s\-]+$/, '');
        var num = shownPhone.replace(/[^0-9+]/g, '');
        return '<a class="tel" href="tel:' + num + '">' + shownPhone + '</a>' + phone.slice(shownPhone.length);
      }
      var raw = full || bare;
      var shown = raw.replace(/[.;,]+$/, '');
      var href = full ? shown : 'https://' + shown;
      // 長いURLは画面を崩すので、見せるのはドメインだけにする
      var label = shown.replace(/^https?:\/\//, '').replace(/^www\./, '').split(/[\/?#]/)[0];
      return '<a href="' + href + '" target="_blank" rel="noopener">' + label + '</a>' + raw.slice(shown.length);
    });
  }
  function mapLink(d, koStr) {
    var tpl = (d.cover && d.cover.map_url_template) || 'https://map.naver.com/p/search/{q}';
    var q = String(koStr || '').split(' / ')[0].trim();
    if (!q) return '';
    if (q.indexOf('대구') < 0) q += ' 대구';
    return '<a class="maplink" href="' + esc(tpl.replace('{q}', encodeURIComponent(q))) + '" target="_blank" rel="noopener">地図</a>';
  }
  function siteLink(url) {
    var u = String(url || '').trim();
    if (!/^https?:\/\//.test(u)) return '';
    return '<a class="maplink maplink--site" href="' + esc(u) + '" target="_blank" rel="noopener">公式</a>';
  }
  function has(s) { return String(s == null ? '' : s).trim() !== ''; }
  function hash(s) {
    var h = 5381;
    s = String(s);
    for (var i = 0; i < s.length; i++) { h = ((h << 5) + h + s.charCodeAt(i)) | 0; }
    return (h >>> 0).toString(36);
  }
  function kos(s, yomiStr) {
    var yomis = String(yomiStr || '').split(' / ');
    return String(s || '').split(' / ').filter(has).map(function (p, i) {
      var y = (yomis[i] || '').trim();
      return '<span class="kogroup"><span class="ko" lang="ko">' + esc(p.trim()) + '</span>' +
        (y ? '<small class="yomi">' + esc(y) + '</small>' : '') + '</span>';
    }).join('');
  }
  function heat(s) {
    s = String(s || '');
    if (!s) return 'na';
    if (/かなり|激辛|とても辛/.test(s)) return '3';
    if (/辛くない|辛さなし|辛味なし/.test(s) && !/中辛|辛口/.test(s)) return '0';
    if (/辛口/.test(s)) return '2';
    if (/中辛|少し辛|ピリ辛/.test(s)) return '1';
    return 'na';
  }
  function dayClass(i) { return 'd' + ((i % 3) + 1); }
  function sec(id, title, inner, note) {
    return '<section class="sec wrap" id="' + id + '"><h2 class="sec__title"><span>' + esc(title) + '</span></h2>' +
      (note ? '<p class="sec__note">' + esc(note) + '</p>' : '') + inner + '</section>';

  function kvBox(rows, amount) {
    if (!rows || !rows.length) return '';

  /* ---------------- 画面への反映 ---------------- */
  function mount(d, preview) {
    try {
      appEl.innerHTML = render(d, preview);
    } catch (e) {
      appEl.innerHTML = '<div class="wrap"><p class="status" data-tone="err">表示に失敗しました。Excelの中身を確かめてください。</p></div>';
      return false;
    }
    bindChecks();
    bindUpdater();
    applyState();
    return true;
  }

  function bindChecks() {
    var state = {};
    try { state = JSON.parse(localStorage.getItem(CHECK_KEY) || '{}') || {}; } catch (e) { state = {}; }
    var boxes = appEl.querySelectorAll('input[data-check]');
    Array.prototype.forEach.call(boxes, function (el) {
      var id = el.getAttribute('data-check');
      if (state[id]) el.checked = true;
      el.addEventListener('change', function () {
        state[id] = el.checked;
        try { localStorage.setItem(CHECK_KEY, JSON.stringify(state)); } catch (e) { /* 保存できない環境 */ }
      });
    });
  }

  function q(sel) { return appEl.querySelector(sel); }

  function status(text, tone) {
    lastStatus = { text: text, tone: tone || '' };
    var el = q('.status');
    if (el) { el.textContent = text; el.setAttribute('data-tone', tone || ''); }
  }

  function applyState() {
    var exp = q('[data-act="export"]');
    var pub = q('[data-act="publish"]');
    var rev = q('[data-act="revert"]');
    if (exp) exp.disabled = busy || !downloadsNs;
    if (pub) pub.disabled = busy || !pending || !artifactNs || !canPublish;
    if (rev) rev.disabled = busy || !pending;
    status(lastStatus.text, lastStatus.tone);
  }

  function bindUpdater() {
    var exp = q('[data-act="export"]');
    var pub = q('[data-act="publish"]');
    var rev = q('[data-act="revert"]');
    var file = q('#shiori-xlsx');
    if (exp) exp.addEventListener('click', exportWorkbook);
    if (pub) pub.addEventListener('click', publishPending);
    if (rev) rev.addEventListener('click', revert);
    if (file) file.addEventListener('change', function () {
      var f = file.files && file.files[0];
      file.value = '';
      if (f) importWorkbook(f);
    });
  }

  function setBusy(v) { busy = v; applyState(); }

  /* ---------------- Excel ---------------- */
  var sheetjsPromise = null;
  function loadSheetJS() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (sheetjsPromise) return sheetjsPromise;
    sheetjsPromise = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = SHEETJS_SRC;
      s.onload = function () { window.XLSX ? resolve(window.XLSX) : reject(new Error('sheetjs')); };
      s.onerror = function () { sheetjsPromise = null; reject(new Error('sheetjs')); };
      (document.head || document.documentElement).appendChild(s);
    });
    return sheetjsPromise;
  }

  function currentData() { return pending || ORIGINAL; }

  function exportWorkbook() {
    if (!downloadsNs || busy) return;
    setBusy(true);
    status('Excelを作っています。');
    loadSheetJS().then(function (XLSX) {
      var d = currentData();
      var wb = XLSX.utils.book_new();
      var guide = XLSX.utils.aoa_to_sheet(GUIDE.map(function (l) { return [l]; }));
      guide['!cols'] = [{ wch: 110 }];
      XLSX.utils.book_append_sheet(wb, guide, '使い方');
      SPEC.forEach(function (sh) {
        var aoa;
        var cols;
        if (sh.type === 'kv') {
          var obj = d[sh.key] || {};
          aoa = [['項目', '内容']].concat(sh.fields.map(function (f) { return [f[0], obj[f[1]] || '']; }));
          cols = [{ wch: 22 }, { wch: 100 }];
        } else {
          aoa = [sh.cols.map(function (col) { return col[0]; })].concat((d[sh.key] || []).map(function (r) {
            return sh.cols.map(function (col) { return r[col[1]] || ''; });
          }));
          cols = sh.cols.map(function (col) { return { wch: col[2] }; });
        }
        var ws = XLSX.utils.aoa_to_sheet(aoa);
        ws['!cols'] = cols;
        XLSX.utils.book_append_sheet(wb, ws, sh.sheet);
      });
      var bytes = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
      return downloadsNs.save({ filename: XLSX_NAME, data: new Blob([bytes]) });
    }).then(function (res) {
      if (res && res.status === 'saved') status('Excelを保存しました。書き換えたら、手順3で読み込んでください。', 'ok');
      else status('Excelを渡しました。', 'ok');
      setBusy(false);
    }, function (e) {
      var code = e && e.code;
      if (code === 'declined') status('Excelの保存をやめました。', '');
      else if (code === 'rate_limited') status('保存の確認画面がすでに開いています。そちらで選んでください。', 'warn');
      else if (code === 'rejected_extension' || code === 'extension_not_enabled') status('この画面ではExcel形式の保存が使えません。', 'warn');
      else if (code === 'unavailable' || code === 'not_granted' || code === 'capability_disabled' || code === 'capability_removed') {
        downloadsNs = null;
        status('この画面ではExcelの保存が使えません。', 'warn');
      } else if (e && e.message === 'sheetjs') status('Excelを作る部品を読み込めませんでした。通信状態を確かめてから、もう一度押してください。', 'err');
      else status('Excelを保存できませんでした。もう一度押してください。', 'err');
      setBusy(false);
    });
  }

  function readWorkbook(XLSX, buf) {
    var wb = XLSX.read(buf, { type: 'array' });
    var data = {};
    var errors = [];
    var notes = [];
    SPEC.forEach(function (sh) {
      var ws = wb.Sheets[sh.sheet];
      if (!ws) { errors.push('「' + sh.sheet + '」シートが見つかりません。'); return; }
      var aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false, blankrows: true });
      if (sh.type === 'kv') {
        var map = {};
        sh.fields.forEach(function (f) { map[f[0]] = f[1]; });
        var obj = {};
        aoa.slice(1).forEach(function (r) {
          var key = String(r[0] == null ? '' : r[0]).trim();
          if (map[key]) obj[map[key]] = String(r[1] == null ? '' : r[1]).trim();
        });
        data[sh.key] = obj;
        return;
      }
      var head = (aoa[0] || []).map(function (h) { return String(h).trim(); });
      var idx = {};
      var missing = [];
      sh.cols.forEach(function (col) {
        var i = head.indexOf(col[0]);
        if (i < 0) missing.push(col[0]);
        idx[col[1]] = i;
      });
      if (missing.length) {
        errors.push('「' + sh.sheet + '」シートの1行目に「' + missing.join('」「') + '」の見出しがありません。');
        return;
      }
      var rows = [];
      aoa.slice(1).forEach(function (r, n) {
        var o = {};
        var any = false;
        sh.cols.forEach(function (col) {
          var v = String(r[idx[col[1]]] == null ? '' : r[idx[col[1]]]).trim();
          if (v) any = true;
          o[col[1]] = v;
        });
        if (any) { o._row = n + 2; rows.push(o); }
      });
      data[sh.key] = rows;
    });
    if (!errors.length) {
      var keys = (data.days || []).map(function (d) { return d.day; });
      if (!keys.length) errors.push('「日ごと」シートに日がありません。');
      (data.slots || []).forEach(function (s) {
        if (keys.indexOf(s.day) < 0) {
          errors.push('「行程」シート ' + s._row + '行目の「日」が「' + (s.day || '空欄') + '」です。' + keys.join('・') + ' のどれかにしてください。');
        }
        ['start', 'end'].forEach(function (k) {
          if (!s[k]) return;
          var m = /^(\d{1,2})[:：](\d{2})/.exec(s[k]);
          if (m) s[k] = ('0' + m[1]).slice(-2) + ':' + m[2];
          else notes.push('「行程」シート ' + s._row + '行目の時刻「' + s[k] + '」は 09:30 の形ではありません。そのまま表示します。');
        });
      });
    }
    SPEC.forEach(function (sh) {
      if (sh.type === 'rows' && data[sh.key]) data[sh.key].forEach(function (r) { delete r._row; });
    });
    return { data: data, errors: errors, notes: notes };
  }

  function importWorkbook(file) {
    if (busy) return;
    if (!/\.xlsx$/i.test(file.name)) { status('.xlsx 形式のファイルを選んでください。', 'err'); return; }
    setBusy(true);
    status('Excelを読み込んでいます。');
    Promise.all([loadSheetJS(), file.arrayBuffer()]).then(function (r) {
      var res = readWorkbook(r[0], r[1]);
      if (res.errors.length) {
        var shown = res.errors.slice(0, 5).join(' ');
        if (res.errors.length > 5) shown += ' ほか' + (res.errors.length - 5) + '件。';
        setBusy(false);
        status('読み込めませんでした。' + shown, 'err');
        return;
      }
      pending = res.data;
      busy = false;
      lastStatus = {
        text: '読み込みました。ページを上から確かめて、問題がなければ「この内容で公開」を押してください。' +
          (artifactNs && canPublish ? '' : 'この画面では公開できないため、確認だけができます。') +
          (res.notes.length ? ' ' + res.notes.slice(0, 3).join(' ') : ''),
        tone: res.notes.length ? 'warn' : 'ok'
      };
      if (mount(pending, true)) {
        var upd = document.getElementById('update');
        if (upd && upd.scrollIntoView) upd.scrollIntoView({ block: 'start' });
      }
    }, function (e) {
      setBusy(false);
      if (e && e.message === 'sheetjs') status('Excelを読む部品を読み込めませんでした。通信状態を確かめてから、もう一度選んでください。', 'err');
      else status('このファイルはExcelとして読めませんでした。保存し直してから選んでください。', 'err');
    });
  }

  function revert() {
    if (!pending || busy) return;
    pending = null;
    lastStatus = { text: '読み込む前の内容に戻しました。', tone: '' };
    mount(ORIGINAL, false);
  }

  /* ---------------- 公開 ---------------- */
  function buildDoc(d) {
    var css = document.getElementById('shiori-css').textContent;
    var app = document.getElementById('shiori-app').textContent;
    var fontsEl = document.getElementById('shiori-fonts');
    var fonts = fontsEl ? fontsEl.getAttribute('href') : '';
    var descEl = document.querySelector('meta[name="description"]');
    var desc = descEl ? descEl.getAttribute('content') : '';
    var json = function (o) { return JSON.stringify(o).replace(/</g, '\\u003c'); };
    return '<!doctype html>\n<html lang="ja"><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">' +
      '<title>' + esc(document.title || TITLE_FALLBACK) + '</title>' +
      '<meta name="description" content="' + esc(desc) + '">' +
      '<link rel="preconnect" href="https://fonts.googleapis.com">' +
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>' +
      '<link id="shiori-fonts" rel="stylesheet" href="' + esc(fonts) + '">' +
      '<style id="shiori-css">' + css + '<\/style></head><body>' +
      '<div id="app" class="page" lang="ja">' + render(d, false) + '</div>' +
      '<script type="application/json" id="shiori-data">' + json(d) + '<\/script>' +
      '<script type="application/json" id="shiori-spec">' + json(SPEC) + '<\/script>' +
      '<script id="shiori-app">' + app + '<\/script></body></html>';
  }

  function publishPending() {
    if (!pending || !artifactNs || !canPublish || busy) return;
    setBusy(true);
    status('公開しています。');
    var doc = buildDoc(pending);
    try { sessionStorage.setItem(FLASH_KEY, '1'); } catch (e) { /* 使えない環境 */ }
    artifactNs.publish(doc).then(function () {
      status('公開しました。新しい内容で開き直します。', 'ok');
    }, function (e) {
      try { sessionStorage.removeItem(FLASH_KEY); } catch (err) { /* 使えない環境 */ }
      var code = e && e.code;
      if (code === 'conflict') {
        status('ほかの画面で先に更新されたため、最新の内容で開き直します。開き直した後に、Excelをもう一度読み込んでください。', 'warn');
      } else if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required' || code === 'not_declared' ||
        code === 'capability_disabled' || code === 'capability_removed' || code === 'read_only_path') {
        canPublish = false;
        status('この画面は閲覧のみのため公開できません。読み込んだ内容の確認はできます。', 'warn');
      } else if (code === 'too_large') {
        status('内容が大きすぎて公開できませんでした。長い文章を短くしてから読み込み直してください。', 'err');
      } else if (code === 'rate_limited') {
        status('公開が続いたため、いまは受け付けられません。少し時間をおいてから押してください。', 'warn');
      } else if (code === 'invalid_content' || code === 'transform_error') {
        status('ページの形が正しくないため公開できませんでした。', 'err');
      } else {
        status('公開できませんでした。少し時間をおいて、もう一度押してください。', 'err');
      }
      setBusy(false);
    });
  }

  /* ---------------- 起動 ---------------- */
  var flashed = false;
  try { flashed = sessionStorage.getItem(FLASH_KEY) === '1'; sessionStorage.removeItem(FLASH_KEY); } catch (e) { flashed = false; }
  if (flashed) lastStatus = { text: '公開しました。いま表示しているのが新しい内容です。', tone: 'ok' };
  mount(ORIGINAL, false);

  function capsReady(dl, art) {
    downloadsNs = dl || null;
    artifactNs = art || null;
    capsKnown = true;
    if (!flashed && !pending) {
      if (downloadsNs && artifactNs) lastStatus = { text: 'Excelの保存・読み込み・公開が使えます。', tone: '' };
      else if (downloadsNs) lastStatus = { text: 'Excelの保存と読み込みが使えます。この画面からの公開はできません。', tone: '' };
      else if (artifactNs) lastStatus = { text: 'Excelの読み込みと公開が使えます。この画面ではExcelの保存ができません。', tone: '' };
      else lastStatus = { text: 'この画面では、読み込んだExcelの確認だけができます。保存と公開は claude.ai でこの栞を開くと使えます。', tone: '' };
    }
    applyState();
  }

  window.shiori = { mount: mount, render: render, SPEC: SPEC, data: ORIGINAL };

  if (window.claude && typeof window.claude.use === 'function') {
    Promise.all([
      window.claude.use('downloads').catch(function () { return null; }),
      window.claude.use('artifact').catch(function () { return null; })
    ]).then(function (r) { capsReady(r[0], r[1]); }, function () { capsReady(null, null); });
  } else {
    capsReady(null, null);
  }
})();
</script>
<script id="shiori-sheets">(function () {
  'use strict';
  // 公開ページ用: Googleスプレッドシートを読んで、栞の中身を置き換える
  var SHEET_ID = '';          // 空のままなら、ページに入っている内容だけを使う
  var API = window.shiori;
  if (!API) return;

  // アーティファクトの外（公開ページ）では、Excelの保存・公開の欄を出さない
  if (!window.claude) {
    var up = document.getElementById('update');
    if (up && up.parentNode) up.parentNode.removeChild(up);
    var navLink = document.querySelector('.toc a[href="#update"]');
    if (navLink && navLink.parentNode && navLink.parentNode.parentNode) {
      navLink.parentNode.parentNode.removeChild(navLink.parentNode);
    }
  }
  if (!SHEET_ID || SHEET_ID.indexOf('__') === 0) return;

  function parseCsv(text) {
    var rows = [];
    var row = [];
    var field = '';
    var inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (inQuotes) {
        if (ch === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else inQuotes = false;
        } else field += ch;
      } else if (ch === '"') {
        inQuotes = true;
      } else if (ch === ',') {
        row.push(field); field = '';
      } else if (ch === '\n') {
        row.push(field); rows.push(row); row = []; field = '';
      } else if (ch !== '\r') {
        field += ch;
      }
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function sheetUrl(name) {
    return 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
      '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(name);
  }

  function readSheet(sh) {
    return fetch(sheetUrl(sh.sheet), { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error(sh.sheet);
      return r.text();
    }).then(function (text) {
      var rows = parseCsv(text).filter(function (r) { return r.some(function (c) { return String(c).trim(); }); });
      if (!rows.length) throw new Error(sh.sheet);
      if (sh.type === 'kv') {
        var map = {};
        sh.fields.forEach(function (f) { map[f[0]] = f[1]; });
        var obj = {};
        rows.slice(1).forEach(function (r) {
          var key = String(r[0] || '').trim();
          if (map[key]) obj[map[key]] = String(r[1] == null ? '' : r[1]).trim();
        });
        return [sh.key, obj];
      }
      var head = rows[0].map(function (h) { return String(h).trim(); });
      var idx = {};
      var missing = false;
      sh.cols.forEach(function (c) {
        var i = head.indexOf(c[0]);
        if (i < 0) missing = true;
        idx[c[1]] = i;
      });
      if (missing) throw new Error(sh.sheet);
      var out = [];
      rows.slice(1).forEach(function (r) {
        var o = {};
        var any = false;
        sh.cols.forEach(function (c) {
          var v = String(r[idx[c[1]]] == null ? '' : r[idx[c[1]]]).trim();
          if (v) any = true;
          o[c[1]] = v;
        });
        if (any) out.push(o);
      });
      return [sh.key, out];
    });
  }

  function stamp(text, tone) {
    var el = document.getElementById('sheet-note');
    if (!el) return;
    el.textContent = text;
    el.setAttribute('data-tone', tone || '');
  }

  Promise.all(API.SPEC.map(readSheet)).then(function (pairs) {
    var data = {};
    pairs.forEach(function (p) { data[p[0]] = p[1]; });
    if (!data.days || !data.days.length || !data.slots || !data.slots.length) throw new Error('empty');
    API.mount(data, false);
    var now = new Date();
    var hh = ('0' + now.getHours()).slice(-2);
    var mm = ('0' + now.getMinutes()).slice(-2);
    stamp('この内容は共有シートから読み込んでいます（' + hh + ':' + mm + ' 時点）。', 'ok');
  }).catch(function () {
    stamp('共有シートを読めなかったため、このページに保存されている内容を表示しています。', 'warn');
  });
})();
</script>
